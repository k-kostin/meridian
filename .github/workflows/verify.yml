name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check public repository hygiene
        run: python scripts/check_public_readiness.py

      - name: Run Django system check
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/electron_shell/package-lock.json

      - name: Verify Electron dependency lock
        working-directory: desktop/electron_shell
        run: npm ci --ignore-scripts

      - name: Check Electron JavaScript and packaging contract
        run: |
          node --check desktop/electron_shell/src/main.js
          node --check desktop/electron_shell/scripts/check-packaging-contract.js
          node desktop/electron_shell/scripts/check-packaging-contract.js
